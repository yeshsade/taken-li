<!doctype html>
<html lang="he" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הגדרות</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8ebef;color:#222;font:15px Arial,"Noto Sans Hebrew",sans-serif}button,input,select{font:inherit;color:inherit}button,select,input[type=number]{border:1px solid #b8bdc5;border-radius:4px;background:#fff;padding:7px 13px}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #2466a8;outline-offset:3px}h1,h2,p{margin:0}h1{font-size:25px;font-weight:600}h2{font-size:17px;font-weight:600}p{line-height:1.6}.stage{padding:36px 60px}.window{max-width:940px;margin:auto;background:#fafafa;border:1px solid #b9bec6;border-radius:8px;box-shadow:0 8px 24px #2834461a;overflow:hidden}.titlebar{height:42px;background:#f0f1f3;border-bottom:1px solid #d9dce0;display:flex;align-items:center;justify-content:space-between;padding-inline:18px;font-size:13px}.title-name{display:flex;gap:9px;align-items:center}.app-mark{display:grid;place-items:center;border:1px solid #9099a4;border-radius:3px;width:22px;height:22px;font-size:13px}.chrome{direction:ltr;display:flex;gap:23px;color:#5b6068}.header{padding:25px 30px 22px;display:flex;align-items:center;justify-content:space-between;gap:20px}.subtitle{font-size:14px;color:#62666e;margin-top:8px}.lang{font-size:13px;white-space:nowrap;display:flex;align-items:center;gap:10px}.lang select{padding:6px 9px}.content{padding:0 30px 24px}.tabs{display:flex;border-bottom:1px solid #c9cdd3;margin-bottom:21px;gap:10px}.tab{border:0;border-radius:0;background:transparent;padding:10px 16px;color:#5b626b;font-size:14px}.tab.active{color:#1c568b;border-bottom:3px solid #28699e;font-weight:600}.section-intro{color:#62666e;font-size:14px;margin-top:7px;margin-bottom:19px}.action{display:flex;align-items:center;justify-content:space-between;gap:22px;min-height:85px;border-bottom:1px solid #e0e2e6}.action:last-child{border-bottom:0}.action-name{font-weight:600;font-size:16px}.example{margin-top:7px;display:flex;align-items:center;gap:10px;color:#68707a;font-size:13px}.sample{unicode-bidi:isolate;direction:ltr}.key-set{display:flex;align-items:center;gap:12px;flex-shrink:0}.key{display:inline-flex;justify-content:center;align-items:center;min-width:92px;padding:9px 12px;border:1px solid #b3bac4;border-bottom:3px solid #a8b0ba;border-radius:5px;background:#f7f8fa;color:#222;font:14px Consolas,"Liberation Mono",monospace;direction:ltr;white-space:nowrap}.edit{font-size:13px;padding:7px 13px}.note{font-size:13px;color:#62666e;margin-top:17px;line-height:1.6}.summary{margin-top:26px;padding:15px 16px;border:1px solid #d9dde3;border-radius:5px;background:#f3f5f7;display:flex;align-items:center;justify-content:space-between;gap:12px}.summary strong{font-weight:500;font-size:14px}.summary a{color:#255b8b;font-size:13px;text-decoration:none}.footer{border-top:1px solid #d9dce0;padding:15px 30px;display:flex;justify-content:space-between;align-items:center;background:#f3f4f6}.footer-note{color:#68707a;font-size:12px}.footer-buttons{display:flex;gap:10px}.primary{background:#2a6191;border-color:#2a6191;color:#fff;min-width:90px}.secondary{min-width:76px}.body-two{display:grid;grid-template-columns:172px 1fr;min-height:492px;border-top:1px solid #e0e2e6}.side{background:#f0f2f5;border-inline-end:1px solid #d9dce0;padding:20px 12px}.nav-item{padding:12px 14px;margin-bottom:7px;font-size:14px;border-radius:4px;color:#565e67}.nav-item.selected{background:#dde6ee;color:#204f79;border-inline-start:3px solid #28699e;font-weight:600}.pane{background:white;padding:25px 28px}.two .action{min-height:93px}.two .summary{margin-top:21px;background:#f7f8fa}.two .header{background:#fafafa}.all-content{padding:0 30px 22px}.field-group{border:1px solid #c8cdd4;padding:5px 17px 12px;margin:0 0 18px;border-radius:4px}.field-group legend{padding:0 7px;font-weight:600;font-size:14px}.three .action{min-height:68px}.three .action-name{font-size:14px}.three .example{margin-top:4px;font-size:12px}.three .key{padding:6px 10px;min-width:88px;font-size:13px}.three .edit{font-size:12px;padding:5px 11px}.check-row{display:flex;align-items:center;gap:9px;font-size:14px;margin:11px 0}.check-row input{accent-color:#28699e;width:16px;height:16px;margin:0}.timer-row{display:flex;align-items:center;gap:9px;font-size:14px;margin:12px 25px}.timer-row input{width:68px;padding:5px 7px}.small-note{font-size:12px;color:#62666e;margin:0 25px 4px;line-height:1.6}.three .header{padding-bottom:20px}.three .footer{padding-block:12px}.column-heading{display:flex;justify-content:space-between;color:#737982;font-size:12px;padding-block:7px}.column-heading span:last-child{margin-inline-end:81px}.bottom-settings{display:grid;grid-template-columns:1fr 1fr;gap:18px}.bottom-settings .field-group{margin-bottom:0}a{color:#255b8b}.hint{max-width:940px;margin:17px auto 0;text-align:center;font-size:12px;color:#777e86}@media(max-width:700px){.stage{padding:15px}.header{padding:20px;align-items:start}.content,.all-content{padding-inline:20px}.body-two{grid-template-columns:140px 1fr}.pane{padding:20px}.key-set{gap:6px}.key{min-width:75px}.action{gap:10px}.bottom-settings{grid-template-columns:1fr}.footer-note{max-width:160px}.lang{flex-direction:column;align-items:start}}
</style>
<body><main class="stage" id="stage"></main>
<script>
// Visual exploration only: these controls do not change Windows settings.
const query=new URLSearchParams(location.search);
const mode=['1','2','3'].includes(query.get('mode'))?query.get('mode'):'1';
const en=query.get('lang')==='en';
document.documentElement.lang=en?'en':'he';document.documentElement.dir=en?'ltr':'rtl';
const t=(he,english)=>en?english:he;
document.title=t('הגדרות','Settings');
const titlebar=`<div class="titlebar"><div class="title-name"><span class="app-mark">א</span>${t('הגדרות','Settings')}</div><div class="chrome"><span>−</span><span>□</span><span>×</span></div></div>`;
const language=`<label class="lang">${t('שפת הממשק','Language')}<select id="language" aria-label="${t('שפת הממשק','Interface language')}"><option value="he" ${!en?'selected':''}>עברית</option><option value="en" ${en?'selected':''}>English</option></select></label>`;
const header=`<header class="header"><div><h1>${t('הגדרות','Settings')}</h1><p class="subtitle">${t('שלוש פעולות פשוטות, במקשים שנוחים לך.','Three simple actions, with the keys you prefer.')}</p></div>${language}</header>`;
const actions=[
 [t('תיקון עברית ואנגלית','Fix Hebrew and English'),'akuo','שלום','F10'],
 [t('החלפת אותיות גדולות וקטנות','Swap uppercase and lowercase'),'Hello','hELLO','Shift+F10'],
 [t('היפוך סדר האותיות','Reverse letter order'),'שלום','םולש','F6']
];
const rows=actions.map(([name,from,to,key])=>`<div class="action"><div><div class="action-name">${name}</div><div class="example"><span>${t('לדוגמה:','Example:')}</span><bdi class="sample">${from}</bdi><span aria-label="${t('הופך ל','becomes')}">${en?'→':'←'}</span><bdi class="sample">${to}</bdi></div></div><div class="key-set"><kbd class="key">${key}</kbd><button class="edit" aria-label="${t('שינוי המקש עבור','Change key for')} ${name}">${t('שינוי…','Change…')}</button></div></div>`).join('');
const explanation=t('הפעולה חלה על הטקסט המסומן. אפשר לבחור בהגדרות מה יקרה כשאין סימון.','Actions apply to selected text. Choose what happens without a selection in settings.');
const timerSummary=`<div class="summary"><div><strong>${t('חזרה אוטומטית לעברית: פעילה','Automatic return to Hebrew: On')}</strong><p class="note" style="margin-top:3px">${t('אחרי 30 שניות ללא הקלדה','After 30 seconds without typing')}</p></div><a href="#">${t('שינוי…','Change…')}</a></div>`;
const footer=`<footer class="footer"><span class="footer-note">${t('השינויים יחולו לאחר לחיצה על שמירה.','Changes apply when you select Save.')}</span><div class="footer-buttons"><button class="secondary">${t('ביטול','Cancel')}</button><button class="primary">${t('שמירה','Save')}</button></div></footer>`;
let body='';
if(mode==='1')body=`<div class="content"><nav class="tabs" aria-label="${t('קטגוריות הגדרות','Settings categories')}"><button class="tab active">${t('פעולות ומקשים','Actions and keys')}</button><button class="tab">${t('מקלדת','Keyboard')}</button><button class="tab">${t('כללי','General')}</button></nav><h2>${t('מקשי הפעלה','Activation keys')}</h2><p class="section-intro">${t('לכל פעולה אפשר לבחור מקש יחיד או צירוף מקשים.','Choose a single key or a key combination for each action.')}</p>${rows}<p class="note">${explanation}</p>${timerSummary}</div>`;
if(mode==='2')body=`<div class="body-two"><nav class="side" aria-label="${t('קטגוריות הגדרות','Settings categories')}"><div class="nav-item selected">${t('פעולות ומקשים','Actions and keys')}</div><div class="nav-item">${t('חזרה לעברית','Return to Hebrew')}</div><div class="nav-item">${t('ללא טקסט מסומן','Without a selection')}</div><div class="nav-item">${t('הפעלה וממשק','Startup and interface')}</div></nav><section class="pane"><h2>${t('פעולות ומקשים','Actions and keys')}</h2><p class="section-intro">${t('בחר את המקש שמפעיל כל פעולה בכל תוכנה.','Choose a key for each action across applications.')}</p>${rows}<p class="note">${explanation}</p>${timerSummary}</section></div>`;
if(mode==='3')body=`<div class="all-content"><fieldset class="field-group"><legend>${t('פעולות ומקשים','Actions and keys')}</legend><div class="column-heading"><span>${t('פעולה','Action')}</span><span>${t('מקש הפעלה','Activation key')}</span></div>${rows}</fieldset><fieldset class="field-group"><legend>${t('חזרה אוטומטית לעברית','Automatic return to Hebrew')}</legend><label class="check-row"><input type="checkbox" checked>${t('לחזור לעברית אחרי הפסקה בהקלדה באנגלית','Return to Hebrew after a pause in English typing')}</label><label class="timer-row">${t('זמן ההמתנה:','Wait time:')}<input type="number" value="30" min="1">${t('שניות ללא הקלדה','seconds without typing')}</label><p class="small-note">${t('כל הקלדה מתחילה את הספירה מחדש. התוכנה משתמשת רק בפריסות שכבר מותקנות.','Each keystroke restarts the timer. Only existing keyboard layouts are used.')}</p></fieldset><div class="bottom-settings"><fieldset class="field-group"><legend>${t('כשאין טקסט מסומן','When no text is selected')}</legend><label class="check-row"><input type="radio" name="scope" checked>${t('לתקן את השורה הנוכחית','Correct the current line')}</label><label class="check-row"><input type="radio" name="scope">${t('לתקן את כל הטקסט בשדה','Correct all text in the field')}</label></fieldset><fieldset class="field-group"><legend>${t('הפעלה והסבר','Startup and help')}</legend><label class="check-row"><input type="checkbox">${t('להפעיל עם Windows','Start with Windows')}</label><label class="check-row"><input type="checkbox" checked>${t('להציג הסבר בהפעלת התוכנה','Show an explanation on startup')}</label></fieldset></div></div>`;
document.querySelector('#stage').innerHTML=`<article class="window ${mode==='2'?'two':mode==='3'?'three':'one'}">${titlebar}${header}${body}${footer}</article><p class="hint">${t('הדמיית עיצוב בלבד · ההגדרות המוצגות הן לצורך השוואה','Design preview only · Shown settings are for comparison')}</p>`;
document.querySelector('#language').addEventListener('change',event=>{query.set('lang',event.target.value);location.search=query.toString()});
</script>
</body>
</html>
