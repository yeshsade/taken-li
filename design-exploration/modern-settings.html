<style>
:root{--desktop:#dfe5eb;--chrome:#f3f3f3;--sidebar:#f3f3f3;--surface:#fafafa;--card:#fff;--text:#242424;--muted:#616161;--line:#e0e0e0;--control-border:#8e969f;--accent:#0f6cbd;--on-accent:#fff;--selected:#fff;--selected-text:#0f548c;--key:#f5f5f5;--radius:10px;--space:24px;--shadow:0 16px 48px #1b2d451c}
*{box-sizing:border-box}body{margin:0;color:var(--text);background:var(--desktop);font:15px/1.5 "Segoe UI","Noto Sans Hebrew",Arial,sans-serif}button,select,input{font:inherit}button{cursor:pointer;color:inherit}button,select,input{transition:background-color 130ms,border-color 130ms}button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button:active{filter:brightness(.94)}button:disabled,input:disabled{opacity:.6;cursor:default}h1,h2,h3,p{margin:0}h1{font-size:27px;font-weight:650;line-height:1.4}h2{font-size:16px;font-weight:600}svg{height:20px;width:20px;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;fill:none;flex-shrink:0}.stage{padding:36px 40px}.window{margin:auto;max-width:1060px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}.titlebar{height:43px;display:flex;align-items:center;justify-content:space-between;padding-inline:20px;background:var(--chrome);font-size:13px}.titlebar-name{display:flex;gap:10px;align-items:center}.titlebar-name svg{width:17px;height:17px;color:var(--muted)}.window-controls{display:flex;gap:28px;direction:ltr;color:var(--muted)}.window-controls svg{width:13px;height:13px}.shell{display:grid;grid-template-columns:214px minmax(0,1fr);min-height:606px}.sidebar{display:flex;flex-direction:column;background:var(--sidebar);padding:28px 14px 22px;gap:5px;border-inline-end:1px solid var(--line)}.sidebar-heading{font-size:24px;font-weight:650;padding-inline:15px;margin-bottom:27px;line-height:1.2}.nav-button,.help{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:13px 14px;min-height:46px;border:0;border-radius:6px;background:transparent;font-size:14px;position:relative}.nav-button svg,.help svg{height:18px;width:18px}.nav-button:hover,.help:hover{background:var(--selected)}.nav-button[aria-current=page]{background:var(--selected);color:var(--selected-text);font-weight:600;box-shadow:0 1px 3px #00000009}.nav-button[aria-current=page]:before{content:"";position:absolute;inset-inline-start:0;top:13px;bottom:13px;width:3px;border-radius:4px;background:var(--accent)}.sidebar-bottom{margin-top:auto;padding-top:60px}.help{color:var(--muted);font-size:13px}.main-column{display:flex;flex-direction:column;min-width:0}.pane{padding:31px 32px 28px;flex:1;min-width:0}.page-header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:27px}.lead{color:var(--muted);font-size:14px;line-height:1.7;margin-top:9px;max-width:470px}.language{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:13px;color:var(--muted)}.language svg{width:17px;height:17px}.language select{background:var(--card);color:var(--text);border:1px solid var(--control-border);border-radius:5px;padding:5px 8px;min-width:84px}.list-heading{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:0 19px 9px}.list-heading span:last-child{margin-inline-end:104px}.action-list{display:flex;flex-direction:column;gap:8px}.action{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:14px;min-height:104px;padding:19px 18px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}.action-icon{width:40px;height:40px;display:grid;place-items:center;border-radius:7px;background:var(--key);color:var(--muted)}.action-icon svg{width:23px;height:23px}.action-name{font-size:16px;font-weight:600;line-height:1.6}.example{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:9px;margin-top:7px}.example bdi{unicode-bidi:isolate;font-family:"Segoe UI","Noto Sans Hebrew",Arial,sans-serif}.example svg{height:14px;width:18px}[dir=rtl] .example svg{transform:rotate(180deg)}.shortcut{display:flex;align-items:center;gap:12px}.key{display:flex;gap:4px;align-items:center;direction:ltr;min-width:118px;justify-content:center;color:var(--text);font:13px Consolas,"Liberation Mono",monospace;white-space:nowrap}.key-piece{display:grid;place-items:center;min-width:43px;height:35px;padding-inline:8px;background:var(--key);border:1px solid var(--control-border);border-bottom-width:2px;border-radius:5px}.edit{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--card);border:1px solid var(--control-border);border-radius:5px;min-width:79px;height:36px;font-size:13px}.edit svg{width:13px;height:13px}.edit:hover{background:var(--key)}.selection-note{margin-top:15px;font-size:12px;color:var(--muted);line-height:1.7}.timer-summary{margin-top:25px;padding:17px 18px;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:center;border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}.timer-summary .action-icon{background:transparent}.timer-caption{font-size:14px;font-weight:600}.timer-description{color:var(--muted);font-size:13px;margin-top:4px}.summary-control{display:flex;align-items:center;gap:15px}.text-button{border:0;background:transparent;font-size:13px;color:var(--accent);padding:6px 0;min-height:30px;white-space:nowrap}.switch{width:38px;height:21px;padding:0;border:1px solid var(--control-border);background:var(--key);border-radius:20px;position:relative;flex-shrink:0}.switch[aria-checked=true]{background:var(--accent);border-color:var(--accent)}.switch:after{content:"";width:13px;height:13px;background:var(--on-accent);border-radius:50%;position:absolute;top:3px;inset-inline-start:3px;box-shadow:0 1px 2px #0002}.switch[aria-checked=true]:after{inset-inline-start:auto;inset-inline-end:3px}.footer{padding:16px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-top:1px solid var(--line)}.footer-text{font-size:12px;color:var(--muted)}.footer-buttons{display:flex;gap:8px}.button{height:36px;min-width:92px;border-radius:5px;border:1px solid var(--control-border);padding:5px 20px;background:var(--card);font-size:14px}.button.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}.preview-note{text-align:center;color:#52606c;font-size:12px;margin:17px 0 0}.setting-box{margin-top:24px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);padding:24px}.check{display:flex;align-items:center;gap:12px;margin-bottom:18px}.check input{height:18px;width:18px;accent-color:var(--accent)}.number-field{display:flex;align-items:center;gap:12px;margin-top:22px}.number-field input{width:80px;padding:7px 10px;border:1px solid var(--control-border);border-radius:5px;background:var(--surface);color:var(--text)}.support{margin-top:17px;color:var(--muted);font-size:13px;line-height:1.8}.scope-option{padding:18px 0;display:flex;gap:12px;align-items:center}.scope-option input{accent-color:var(--accent)}.help-copy{margin-block:14px;font-size:15px;line-height:1.8}.preview-status{font-size:12px;color:var(--muted);margin-top:14px;min-height:22px}.key-dialog{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;max-width:440px;padding:28px}.key-dialog::backdrop{background:#0006}.key-dialog h2{margin-bottom:12px}.key-dialog p{font-size:14px;color:var(--muted)}.key-dialog input{margin-block:20px;padding:12px;border:1px solid var(--control-border);background:var(--key);color:var(--text);border-radius:5px;width:100%;direction:ltr;text-align:center;font-family:Consolas,monospace}.modal-buttons{display:flex;justify-content:flex-end;gap:8px}.skip{position:fixed;top:-80px;inset-inline-start:10px;background:var(--card);color:var(--text);padding:12px;z-index:3}.skip:focus{top:10px}
body.graphite{--desktop:#151a21;--chrome:#20262e;--sidebar:#20262e;--surface:#252b33;--card:#2c333d;--text:#f1f4f8;--muted:#afbbc9;--line:#454f5e;--control-border:#718195;--accent:#91c4f4;--on-accent:#142331;--selected:#313d4d;--selected-text:#d1e7fb;--key:#232a33;--radius:8px;--shadow:0 18px 56px #0004}body.graphite .preview-note{color:#b1bdc9}body.graphite .action{min-height:109px;border-color:transparent}body.graphite .action-icon{color:var(--accent);background:#293f51}body.graphite .timer-summary{background:transparent;border-color:var(--line)}body.graphite .nav-button[aria-current=page]{box-shadow:none}body.graphite .sidebar-bottom{border-top:1px solid var(--line);margin-top:auto;padding-top:15px}body.graphite .footer{background:#20262e}body.graphite .action-name{font-weight:550}
body.soft{--desktop:#e8e7e1;--chrome:#f5f4ef;--sidebar:#f5f4ef;--surface:#fffefb;--card:#fffefb;--text:#292d2a;--muted:#646b65;--line:#dedfd7;--control-border:#8e968b;--accent:#466151;--on-accent:#fff;--selected:#e4eae2;--selected-text:#354d3e;--key:#f4f5ef;--radius:4px;--shadow:0 10px 32px #363e2b14}body.soft .sidebar{border:0}body.soft .pane{padding:36px 38px 31px}body.soft .page-header{margin-bottom:34px}body.soft .action-list{gap:0;border-top:1px solid var(--line)}body.soft .action{border:0;border-bottom:1px solid var(--line);border-radius:0;min-height:98px;padding:18px 4px;grid-template-columns:minmax(0,1fr) auto}body.soft .action>.action-icon{display:none}body.soft .action-name{font-size:16px;font-weight:550}body.soft .list-heading{padding-inline:4px}body.soft .key-piece{background:transparent;border-radius:4px;border-bottom-width:1px}body.soft .edit{border-color:transparent;background:transparent;color:var(--accent);min-width:77px}body.soft .edit:hover{border-color:var(--control-border)}body.soft .timer-summary{margin-top:29px;background:var(--key);border:0;padding:21px 18px}body.soft .sidebar-heading{font-size:23px}body.soft .nav-button[aria-current=page]{box-shadow:none}body.soft .footer{background:var(--surface);padding-inline:38px}body.soft .preview-note{color:#60675f}body.soft .button{border-radius:4px}body.soft .switch{height:22px;width:39px}
@media(prefers-reduced-motion:reduce){button,select,input{transition:none}}@media(max-width:850px){.stage{padding:16px}.shell{grid-template-columns:180px minmax(0,1fr)}.pane,body.soft .pane{padding:24px}.action{grid-template-columns:minmax(0,1fr) auto;padding-inline:14px;gap:10px}.action>.action-icon{display:none}.action-name{font-size:14px}.key{min-width:92px;font-size:12px}.key-piece{min-width:35px;padding-inline:5px}.shortcut{gap:6px}.edit{min-width:67px}.edit svg{display:none}.language{gap:4px}.language>span{display:none}.page-header{gap:12px}.footer{padding-inline:24px}.summary-control{gap:8px}}@media(max-width:650px){.shell{grid-template-columns:1fr}.sidebar{border-inline-end:0;padding:20px;gap:8px}.sidebar-heading{margin-bottom:10px}.nav-button{min-height:42px;padding:8px 12px}.sidebar-bottom{display:none}.pane,body.soft .pane{padding:20px}.action,body.soft .action{grid-template-columns:1fr;gap:12px;padding:16px}.shortcut{justify-content:space-between}.key{justify-content:start}.page-header{flex-wrap:wrap}.timer-summary{grid-template-columns:1fr}.timer-summary>.action-icon{display:none}.summary-control{justify-content:space-between}.footer{align-items:start;flex-direction:column}.footer-buttons{width:100%;justify-content:flex-end}.list-heading{display:none}.preview-note{font-size:11px}}

<body><a class="skip" href="#page-title">דלג להגדרות</a><main id="stage" class="stage"></main>
<script>
const query=new URLSearchParams(location.search);
const mode=['1','2','3'].includes(query.get('mode'))?query.get('mode'):'1';
const en=query.get('lang')==='en';
const t=(he,english)=>en?english:he;
document.documentElement.lang=en?'en':'he';document.documentElement.dir=en?'ltr':'rtl';
document.title=t('הגדרות','Settings');document.body.className=mode==='2'?'graphite':mode==='3'?'soft':'fluent';
const paths={keyboard:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 12h.01M10 12h.01M14 12h.01M18 12h.01M7 16h10"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',selection:'<path d="M8 3H4a1 1 0 0 0-1 1v4m13-5h4a1 1 0 0 1 1 1v4M3 16v4a1 1 0 0 0 1 1h4m8 0h4a1 1 0 0 0 1-1v-4M7 9h10M7 13h7"/>',settings:'<path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="var(--sidebar)"/><circle cx="15" cy="12" r="2" fill="var(--sidebar)"/><circle cx="8" cy="18" r="2" fill="var(--sidebar)"/>',case:'<path d="m3 17 5-12 5 12M5 13h6M15 11c1-2 6-2 6 1v5m0-3c-7-2-7 5 0 2"/>',reverse:'<path d="M4 7h15l-4-4M20 17H5l4 4"/>',arrow:'<path d="M3 12h18m-6-5 6 5-6 5"/>',pencil:'<path d="m15 4 5 5M4 20l4-1L21 6a2 2 0 0 0-3-3L5 16l-1 4Z"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 4 2c-1 .7-1.5 1-1.5 2M12 17h.01"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c5 5 5 13 0 18-5-5-5-13 0-18Z"/>'};
const icon=name=>`<svg viewBox="0 0 24 24" aria-hidden="true">${paths[name]}</svg>`;
const labels=[t('פעולות ומקשים','Actions and keys'),t('חזרה לעברית','Return to Hebrew'),t('ללא טקסט מסומן','Without a selection'),t('הפעלה וממשק','Startup and interface')];
const actions=[{name:t('תיקון עברית ואנגלית','Fix Hebrew and English'),from:'akuo',to:'שלום',key:'F10',icon:'keyboard'},{name:t('החלפת אותיות גדולות וקטנות','Swap uppercase and lowercase'),from:'Hello',to:'hELLO',key:'Shift+F10',icon:'case'},{name:t('היפוך סדר האותיות','Reverse letter order'),from:'שלום',to:'םולש',key:'F6',icon:'reverse'}];
const state={autoReturn:true,delay:30,wholeField:false,startup:false,welcome:true};let currentPage=0;
function keyMarkup(value){return value.split('+').map((part,i)=>`${i?'<span aria-hidden="true">+</span>':''}<span class="key-piece">${part}</span>`).join('')}
document.querySelector('.skip').textContent=t('דלג להגדרות','Skip to settings');
document.querySelector('#stage').innerHTML=`<article class="window"><div class="titlebar"><span class="titlebar-name">${icon('settings')}${t('הגדרות','Settings')}</span><span class="window-controls" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M4 8h8"/></svg><svg viewBox="0 0 16 16"><rect x="4" y="4" width="8" height="8"/></svg><svg viewBox="0 0 16 16"><path d="m4 4 8 8m0-8-8 8"/></svg></span></div><div class="shell"><nav class="sidebar" aria-label="${t('נושאי הגדרות','Settings categories')}"><div class="sidebar-heading">${t('הגדרות','Settings')}</div>${labels.map((label,i)=>`<button class="nav-button" data-page="${i}" ${i===0?'aria-current="page"':''}>${icon(['keyboard','clock','selection','settings'][i])}<span>${label}</span></button>`).join('')}<div class="sidebar-bottom"><button class="help" data-help>${icon('help')}${t('עזרה והסבר','Help and explanation')}</button></div></nav><div class="main-column"><section class="pane" id="content"></section><footer class="footer"><span class="footer-text">${t('השינויים יחולו לאחר שמירה.','Changes apply when you save.')}</span><div class="footer-buttons"><button class="button" data-cancel>${t('ביטול','Cancel')}</button><button class="button primary" data-save>${t('שמירה','Save')}</button></div></footer></div></div></article><p class="preview-note">${t('הדמיית עיצוב בלבד · הכפתורים מדגימים את הממשק ואינם משנים את Windows','Design preview only · Controls demonstrate the interface and do not change Windows')}</p><dialog class="key-dialog" id="key-dialog"><h2>${t('בחירת מקש','Choose a key')}</h2><p id="key-caption"></p><label for="key-input" class="support">${t('לחץ מקש F, או אות/ספרה עם Ctrl, Shift או Alt.','Press a function key, or a letter/digit with Ctrl, Shift or Alt.')}</label><input id="key-input" readonly><p id="key-error" role="alert"></p><div class="modal-buttons"><button class="button" id="key-cancel">${t('ביטול','Cancel')}</button><button class="button primary" id="key-ok">${t('אישור','OK')}</button></div></dialog>`;
function header(title,description){return `<header class="page-header"><div><h1 id="page-title" tabindex="-1">${title}</h1><p class="lead">${description}</p></div><label class="language">${icon('globe')}<span>${t('שפה','Language')}</span><select aria-label="${t('שפת הממשק','Interface language')}" id="language"><option value="he" ${!en?'selected':''}>עברית</option><option value="en" ${en?'selected':''}>English</option></select></label></header>`}
function renderPage(page,focus=false){currentPage=page;let html='';
 if(page===0){html=header(labels[0],t('בחר מקש לכל פעולה. אפשר להשתמש במקש יחיד או בצירוף מקשים.','Choose a key for each action. Use a single function key or a key combination.'))+`<div class="list-heading"><span>${t('פעולה','Action')}</span><span>${t('מקש הפעלה','Activation key')}</span></div><div class="action-list">${actions.map((a,i)=>`<div class="action"><div class="action-icon">${icon(a.icon)}</div><div><div class="action-name">${a.name}</div><div class="example"><span>${t('לדוגמה:','Example:')}</span><bdi>${a.from}</bdi>${icon('arrow')}<bdi>${a.to}</bdi></div></div><div class="shortcut"><kbd class="key" aria-label="${a.key}">${keyMarkup(a.key)}</kbd><button class="edit" data-edit="${i}" aria-label="${t('שינוי המקש עבור','Change key for')} ${a.name}">${icon('pencil')}${t('שינוי','Change')}</button></div></div>`).join('')}</div><p class="selection-note">${t('הפעולה תחול רק על הטקסט שסימנת. בלי סימון, אפשר לבחור שורה או שדה שלם.','Actions apply only to selected text. Without a selection, choose a line or the entire field.')}</p><div class="timer-summary"><div class="action-icon">${icon('clock')}</div><div><div class="timer-caption">${t('חזרה אוטומטית לעברית','Automatic return to Hebrew')}</div><p class="timer-description" id="timer-summary-text">${state.autoReturn?t(`פעילה · אחרי ${state.delay} שניות ללא הקלדה`,`On · After ${state.delay} seconds without typing`):t('כבויה','Off')}</p></div><div class="summary-control"><button class="switch" role="switch" aria-checked="${state.autoReturn}" aria-label="${t('חזרה אוטומטית לעברית','Automatic return to Hebrew')}" id="auto-switch"></button><button class="text-button" data-page="1">${t('הגדרות','Settings')}</button></div></div>`}
 else if(page===1){html=header(labels[1],t('המקלדת תחזור לעברית רק אחרי הפסקה בהקלדה באנגלית.','The keyboard returns to Hebrew only after a pause in English typing.'))+`<section class="setting-box"><label class="check"><input type="checkbox" id="timer-enabled" ${state.autoReturn?'checked':''}>${t('להפעיל חזרה אוטומטית לעברית','Enable automatic return to Hebrew')}</label><label class="number-field" for="delay">${t('זמן ההמתנה:','Wait time:')}<input id="delay" type="number" min="1" max="3600" value="${state.delay}" ${state.autoReturn?'':'disabled'}>${t('שניות','seconds')}</label><p class="support">${t('כל הקלדה מתחילה את הספירה מחדש. הטקסט שכבר כתבת לא ישתנה, ולא תתווסף פריסת מקלדת.','Each keystroke restarts the timer. Existing text stays unchanged, and no keyboard layout is added.')}</p></section>`}
 else if(page===2){html=header(labels[2],t('בחר על מה תחול הפעולה כשלא סימנת טקסט.','Choose what an action applies to when no text is selected.'))+`<section class="setting-box"><label class="scope-option"><input type="radio" name="scope" value="line" ${state.wholeField?'':'checked'}>${t('השורה שבה נמצא הסמן','The line containing the cursor')}</label><label class="scope-option"><input type="radio" name="scope" value="field" ${state.wholeField?'checked':''}>${t('כל הטקסט בשדה','All text in the field')}</label><p class="support">${t('אם סימנת טקסט, הפעולה תחול תמיד רק עליו.','When text is selected, actions always apply only to that selection.')}</p></section>`}
 else if(page===3){html=header(labels[3],t('התאם את הפעלת התוכנה ואת הודעת ההסבר.','Choose startup behavior and whether to show the explanation.'))+`<section class="setting-box"><label class="check"><input id="startup" type="checkbox" ${state.startup?'checked':''}>${t('להפעיל עם Windows','Start with Windows')}</label><label class="check"><input id="welcome" type="checkbox" ${state.welcome?'checked':''}>${t('להציג הסבר בהפעלת התוכנה','Show an explanation on startup')}</label><p class="support">${t('אפשר לפתוח את ההסבר בכל עת דרך הסמל ליד השעון. התוכנה פועלת ללא אינטרנט.','Open the explanation at any time from the tray icon. The app works offline.')}</p></section>`}
 else{html=header(t('עזרה והסבר','Help and explanation'),t('שלוש פעולות במקום שבו אתה כותב.','Three actions where you type.'))+`<section class="setting-box">${actions.map(a=>`<p class="help-copy">${a.name} — <bdi>${a.key}</bdi></p>`).join('')}<p class="support">${t('סמן טקסט ולחץ על המקש המתאים. אפשר לשנות את המקשים בדף פעולות ומקשים.','Select text and press the appropriate key. Change keys on the Actions and keys page.')}</p></section>`}
 document.querySelector('#content').innerHTML=html+'<p class="preview-status" role="status"></p>';
 document.querySelectorAll('.nav-button').forEach(b=>{if(Number(b.dataset.page)===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
 document.querySelector('#language').onchange=e=>{query.set('lang',e.target.value);location.search=query.toString()};
 if(focus)document.querySelector('#page-title').focus();
}
document.querySelector('#stage').addEventListener('click',e=>{const page=e.target.closest('[data-page]');if(page){renderPage(Number(page.dataset.page),true);return}if(e.target.closest('[data-help]')){renderPage(4,true);return}const edit=e.target.closest('[data-edit]');if(edit){openKey(Number(edit.dataset.edit));return}if(e.target.closest('#auto-switch')){state.autoReturn=!state.autoReturn;renderPage(0)}if(e.target.closest('[data-save]'))document.querySelector('.preview-status').textContent=t('זו הדמיה בלבד. לא נשמרו הגדרות במחשב.','This is a preview. No computer settings were saved.');if(e.target.closest('[data-cancel]')){Object.assign(state,{autoReturn:true,delay:30,wholeField:false,startup:false,welcome:true});actions.forEach((a,i)=>a.key=['F10','Shift+F10','F6'][i]);renderPage(0)}});
document.querySelector('#content').addEventListener('change',e=>{if(e.target.id==='timer-enabled'){state.autoReturn=e.target.checked;document.querySelector('#delay').disabled=!state.autoReturn}if(e.target.id==='delay'){const value=Number(e.target.value);if(value>=1&&value<=3600)state.delay=value;else{e.target.value=state.delay;document.querySelector('.preview-status').textContent=t('בחר זמן בין שנייה אחת לשעה.','Choose a time from one second to one hour.')}}if(e.target.name==='scope')state.wholeField=e.target.value==='field';if(e.target.id==='startup')state.startup=e.target.checked;if(e.target.id==='welcome')state.welcome=e.target.checked});
let edited=-1,pending='';const dialog=document.querySelector('#key-dialog');
function openKey(i){edited=i;pending=actions[i].key;document.querySelector('#key-caption').textContent=actions[i].name;document.querySelector('#key-input').value=pending;document.querySelector('#key-error').textContent='';dialog.showModal();document.querySelector('#key-input').focus()}
document.querySelector('#key-input').addEventListener('keydown',e=>{if(e.key==='Tab'||e.key==='Escape')return;e.preventDefault();if(!/^F([1-9]|1[0-9]|2[0-4])$/.test(e.key)&&!(/^[a-z0-9]$/i.test(e.key)&&(e.ctrlKey||e.shiftKey||e.altKey)))return;pending=[e.ctrlKey?'Ctrl':null,e.shiftKey?'Shift':null,e.altKey?'Alt':null,e.key.length===1?e.key.toUpperCase():e.key].filter(Boolean).join('+');e.target.value=pending});
document.querySelector('#key-cancel').onclick=()=>dialog.close();document.querySelector('#key-ok').onclick=()=>{if(actions.some((a,i)=>i!==edited&&a.key===pending)){document.querySelector('#key-error').textContent=t('המקש הזה כבר משמש פעולה אחרת. בחר מקש אחר.','This key is already used by another action. Choose a different key.');return}actions[edited].key=pending;dialog.close();renderPage(0)};
renderPage(0);
</script>
</body>
</html>
