name: Build Windows application
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned Qt test fixture (not included in executable)
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r tests/TakenLi.Windows.Checks/qt-windows-requirements.txt
      - name: Check core behavior and publish self-contained application
        shell: pwsh
        run: ./scripts/Publish.ps1
      - name: Check Windows layout, clipboard editing and registered F10
        shell: pwsh
        run: dotnet run --project tests/TakenLi.Windows.Checks --configuration Release -- artifacts/ui-checks
      - name: Upload native UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TakenLi-native-ui-checks
          path: artifacts/ui-checks/*.png
          if-no-files-found: warn
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: TakenLi-windows-x64
          path: artifacts/win-x64/TakenLi.exe
          if-no-files-found: error
